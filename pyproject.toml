[project]
name = "three-blueberries-training"
version = "0.1.0"
description = "Offline model training for the Three Blueberries housing forecaster"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    # Data generation: the FAIR Plan publishes PDFs and the Department of
    # Finance publishes a workbook. Neither offers a CSV.
    "openpyxl>=3.1",
    # The FAIR Plan PDFs carry an owner password, so pypdf needs an AES provider.
    "pypdf[crypto]>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["training/tests"]
